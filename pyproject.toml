[project]
name = "4ehabits"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexandr Holin",email = "holin.alexandr89@gmail.com"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
backend = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "sqlalchemy[asyncio] (>=2.0.53,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "greenlet (>=3.5.6,<4.0.0)"
]
bot = [
    "aiohttp (>=3.14.3,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "redis (>=8.1.0,<9.0.0)",
    "aiogram (>=3.31.0,<4.0.0)"
]
scheduler = [
    "apscheduler (>=3.11.3,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
